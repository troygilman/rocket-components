<!doctype html>
<html>
    <head>
        <script type="importmap">
            {
                "imports": {
                    "datastar": "../vendor/datastar-rocket.js"
                }
            }
        </script>
        <script type="module" src="./draggable.js"></script>
    </head>
    <body>
        <style>
            sb-draggable-container::part(container) {
                view-transition-name: match-element;
                view-transition-class: slide;
            }
            ::view-transition-old(.slide) {
                display: none;
            }
            ::view-transition-new(.slide) {
                animation: none;
                mix-blend-mode: normal;
            }
            ::view-transition-group(.slide) {
                animation-duration: 280ms;
                animation-timing-function: ease;
            }
        </style>
        {{block "containers" .}}
        <div id="containers">
            {{range .}}
            <sb-draggable-container
                id="{{.ID}}"
                data-on:swap="@post('/cmd/swap-containers', {payload: evt.detail})"
            >
                <sb-draggable-trigger>Drag me</sb-draggable-trigger>
                <div>{{.Label}}</div>
            </sb-draggable-container>
            {{end}}
        </div>
        {{end}}
    </body>
</html>
